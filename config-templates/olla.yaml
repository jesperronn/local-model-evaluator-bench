# Olla (https://github.com/thushan/olla) config template — adopted 2026-09-28
# as the unified local proxy, replacing LiteLLM. See
# docs/DECISION-replace-litellm-with-olla.md for the decision and
# docs/DECISION-proxy-olla.md for the spike it's based on.
#
# Used by: `bin/rt olla start` (see cmd_olla in bin/rt), which runs the
# repo-local Olla binary with this file as `--config` and the install dir
# (default .tools/olla, see OLLA_INSTALL_DIR in config.sh) as its CWD.
#
# Two non-obvious setup requirements, both handled automatically by
# `bin/rt olla install` / `bin/rt olla start` — see docs/runtimes/olla.md:
#   1. Olla resolves `config/profiles/*.yaml` relative to its CWD, not to
#      this file's path. `bin/rt olla start` always runs it from the install
#      dir, which holds both the release zip's built-in profiles (omlx,
#      lm-studio, ollama, vllm, llamacpp, ...) and the repo's custom one
#      below. A profiles-less CWD silently falls back to a tiny built-in
#      default set lacking "omlx"/"mtplx", and the endpoint config below then
#      fails to load.
#   2. MTPLX needs a hand-written profile — Olla ships no built-in one, and
#      the generic "openai-compatible" profile's capability_patterns (tuned
#      for cloud "gpt-*"/"*turbo*" names) won't classify "mtplx-*" model IDs
#      as chat-capable, silently breaking tool-call and Anthropic-route
#      requests to it (plain /v1/chat/completions still works). Committed at
#      config-templates/olla-profiles/mtplx.yaml; `bin/rt olla start` copies
#      it into the install dir's config/profiles/ before every start, so it
#      never drifts from what's in the repo.
#   3. lms/ollama are listed even when down — Olla marks them offline and
#      keeps serving the other endpoints fine regardless (see bin/rt status,
#      which controls those runtimes; bin/rt never starts them).
#
server:
  host: "localhost"
  port: 40114
  read_timeout: 30s
  read_header_timeout: 10s
  write_timeout: 0s
  shutdown_timeout: 10s
  request_logging: true

proxy:
  engine: "olla"
  profile: "auto"
  load_balancer: "least-connections"
  connection_timeout: 60s
  connection_keep_alive: 30s
  response_timeout: 15m
  read_timeout: 10m
  response_header_timeout: 30s
  tls_handshake_timeout: 10s
  retry:
    enabled: true
    on_connection_failure: true
    max_attempts: 0

discovery:
  type: "static"
  refresh_interval: 30s
  health_check:
    initial_delay: 1s
  static:
    endpoints:
      - url: "http://127.0.0.1:8000"
        name: "omlx"
        type: "omlx"
        priority: 100
        model_url: "/v1/models"
        health_check_url: "/health"
        check_interval: 2s
        check_timeout: 1s
      - url: "http://127.0.0.1:8001"
        name: "mtplx"
        type: "mtplx"
        priority: 100
        model_url: "/v1/models"
        health_check_url: "/v1/models"
        check_interval: 2s
        check_timeout: 1s
      # splash rejects chunked request bodies (which Olla sends); go via the
      # buffering shim bin/splash-shim (bin/rt splash-shim start) on :8003.
      - url: "http://127.0.0.1:8003"
        name: "splash"
        type: "splash"   # custom profile config-templates/olla-profiles/splash.yaml (Anthropic route on)
        priority: 100
        model_url: "/v1/models"
        health_check_url: "/v1/models"
        check_interval: 5s
        check_timeout: 2s
      - url: "http://127.0.0.1:1234"
        name: "lms"
        type: "lm-studio"
        priority: 90
        model_url: "/v1/models"
        health_check_url: "/v1/models"
        check_interval: 5s
        check_timeout: 2s
      - url: "http://127.0.0.1:11434"
        name: "ollama"
        type: "ollama"
        priority: 90
        model_url: "/api/tags"
        health_check_url: "/"
        check_interval: 5s
        check_timeout: 2s
  model_discovery:
    enabled: true
    interval: 5m
    timeout: 30s
    concurrent_workers: 5
    retry_attempts: 3
    retry_backoff: 1s

model_registry:
  type: "memory"
  enable_unifier: true
  unification:
    stale_threshold: 24h
    cleanup_interval: 10m
  routing_strategy:
    type: "strict"

translators:
  anthropic:
    enabled: true
    passthrough_enabled: true
    max_message_size: 10485760
    inspector:
      enabled: false

logging:
  level: "info"
  format: "json"
  output: "stdout"

engineering:
  show_nerdstats: false

dashboard:
  enabled: true
  access_policy:
    allowed_cidrs:
      - "127.0.0.0/8"
      - "::1/128"
    allowed_hosts:
      - "localhost"
  gate_internal_api: false
