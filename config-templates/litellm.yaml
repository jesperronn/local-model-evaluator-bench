# LiteLLM proxy config — LOCAL RUNTIMES ONLY.
#
# Deliberately contains no hosted/cloud providers and no fallbacks: a request
# for a model whose local backend is down must fail, not silently reroute. A
# cloud fallback would both leak sandbox prompts off-machine and quietly
# invalidate benchmark results by grading a different model than the label says.
#
# Wildcard routes pass the model id through after the prefix, so no model needs
# listing here individually:
#   lms/<id>    -> LM Studio
#   ollama/<id> -> Ollama
#   mlx/<id>    -> mlx_lm.server
#   omlx/<id>   -> oMLX
#   mtplx/<id>  -> MTPLX
#
# Every route below sets litellm_params.custom_llm_provider: "custom_openai"
# instead of relying on `model: "openai/*"` alone to say "OpenAI-compatible".
# That distinction matters for codex/omp, which both call litellm's
# /v1/responses endpoint (Codex always does; omp's built-in "litellm"
# provider does too): litellm only has a Responses<->Chat-Completions bridge
# for providers it does NOT recognize as natively speaking the Responses API.
# `custom_llm_provider: "openai"` (what a bare `model: "openai/*"` resolves
# to) IS recognized as native, so litellm forwards /v1/responses calls
# straight through to `<api_base>/responses` — a route none of our local
# runtimes implement, and upstream 404s ("Received Model Group=...", despite
# the model being registered fine for chat completions). `custom_openai` has
# no native Responses config
# (litellm.utils.ProviderConfigManager.get_provider_responses_api_config
# returns None for it, confirmed against litellm 1.97.0, the version behind
# ghcr.io/berriai/litellm-database:main-stable at the time of this fix), so
# litellm falls back to its `litellm_completion_transformation_handler`
# bridge, which translates the Responses-shaped request into a normal
# /chat/completions call against the same backend — exactly what these
# OpenAI-compatible local servers actually support. It's also still a fully
# supported /chat/completions provider itself (main.py dispatches
# `custom_llm_provider == "custom_openai"` to the same generic
# "openai call with a custom base" handler as `custom_llm_provider ==
# "openai"`), unlike `custom_llm_provider: "openai_like"` — tried first, it
# has no Responses config either but ALSO isn't a recognized chat-completions
# dispatch provider on its own (only used internally as a base handler by
# providers like maritalk/amazon_nova that set their own literal
# custom_llm_provider), so it 400s every request, including plain
# /chat/completions, with "Unmapped LLM provider for this endpoint".
#
# `model` below is bare `"*"`, NOT `"openai/*"`. That's deliberate too, and a
# second bug this fix's first pass missed: `litellm.get_llm_provider(model,
# custom_llm_provider=...)` only strips a recognized "<provider>/" prefix off
# `model` when it derives custom_llm_provider FROM that prefix itself; passing
# custom_llm_provider explicitly (as we do) short-circuits that derivation and
# returns `model` completely unchanged — confirmed against litellm 1.97.0:
# `get_llm_provider(model="openai/foo", custom_llm_provider="custom_openai")`
# returns `("openai/foo", "custom_openai", ...)`, prefix intact. With
# `model: "openai/*"` that meant the literal string `openai/<real-model-id>`
# (the wildcard's "*" substituted from the request, still prefixed) was what
# actually got sent to the backend — invisible against mtplx (a single-model
# server that ignores the `model` field entirely and serves whatever is
# loaded) but breaking every multi-model backend that dispatches by literal
# id: Ollama, LM Studio, and oMLX would 404 with e.g. "model
# 'openai/qwen3.8:27b-mlx' not found" since they only know the model as
# `qwen3.8:27b-mlx`. Dropping the prefix from `model` here (leaving only the
# wildcard's own "*") sends the bare, correct id while `custom_llm_provider`
# still independently decides the Responses-bridge behavior above.
#
# Start with: bin/litellm-proxy

#
# Every entry below sets litellm_params.timeout: 600 explicitly. This is NOT
# redundant with litellm_settings.request_timeout (below) — see the long
# comment there for why both are needed: the per-deployment `timeout` here
# is what keeps real /chat/completions calls able to run for the full 600s
# once request_timeout itself gets lowered to bound model-discovery calls.

model_list: []

litellm_settings:
  # Drops Copilot CLI's Responses-API-only `apply_patch` tool (type: "custom",
  # a freeform grammar tool none of our local runtimes implement) before it
  # reaches the backend — see config-templates/litellm-hooks/strip_unsupported_tools.py
  # for why forwarding it crashes the proxy's streaming-iterator hook chain.
  callbacks:
    - hooks.strip_unsupported_tools.proxy_handler_instance
  # REQUIRED, not a nicety. Without it a wildcard route makes /v1/models return
  # litellm's built-in OpenAI registry with our prefix pasted on — 642 entries,
  # zero of them real, 549 cloud names like `lms/o3-deep-research`. That both
  # breaks discovery and dangles hosted model names in a local-only setup. With
  # it, litellm queries each backend and returns what is actually installed.
  check_provider_endpoint: true
  # No cross-backend fallbacks: fail closed rather than grading the wrong model.
  num_retries: 0
  # This is now a DISCOVERY-call timeout, not the completions timeout it looks
  # like at first glance. Confirmed by reading litellm 1.97.0 source
  # (litellm/_lazy_imports.py + litellm/llms/openai/chat/gpt_transformation.py):
  # check_provider_endpoint's live `/v1/models` probe of each backend
  # (GET /v1/models, GET /model/info, and the check_provider_endpoint calls
  # above) goes through `litellm.module_level_client`, a single shared httpx
  # client created ONCE at startup with `timeout=litellm.request_timeout` —
  # i.e. exactly this value — and that call passes no per-request timeout
  # override. With a down backend (MTPLX not running, etc.) that GET simply
  # blocks for the full request_timeout before litellm logs
  # "Error getting valid models: [Errno 110] Connection timed out" — 600s was
  # turning a routine "is this backend up" check into a multi-minute hang.
  # litellm 1.97.0 has no separate/dedicated timeout knob for
  # check_provider_endpoint or discovery calls, so this value is the only
  # server-side lever for it — hence 10s here, not 600s.
  #
  # Real /chat/completions calls do NOT read this value: litellm's router
  # resolves each request's timeout as (in priority order) an explicit
  # per-call timeout, then the deployment's own litellm_params.timeout, then
  # router_settings.timeout, and only falls back to this request_timeout
  # last (litellm/router.py Router._get_timeout). Every model_list entry
  # above sets litellm_params.timeout: 600 explicitly for exactly this
  # reason, so completions still get the full 10 minutes some local models
  # genuinely need for a slow first token / long agentic turn — only the
  # discovery path (which sets no such override) inherits this 10s.
  request_timeout: 10
  drop_params: true

# PII redaction was attempted via litellm's built-in Presidio guardrail and
# removed — see docs/archived/DECISION-pii-guardrail-presidio.md for why, and
# for the pre/post-call hook alternative to explore instead.

general_settings:
  # Local-only proxy; no telemetry, no spend tracking.
  telemetry: false
  # Persist models added via the admin API (POST /model/new) into Postgres
  # instead of only in-memory, so they survive a proxy restart. Requires
  # DATABASE_URL (bin/litellm-proxy provisions a local Docker Postgres) and
  # LITELLM_MASTER_KEY to authenticate the admin endpoints.
  store_model_in_db: true
