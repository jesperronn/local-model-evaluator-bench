# Hardware profiles → recommended models
# Format: profile_name | min_ram | max_ram | tier_description | alias1,alias2,... | primary
# Use ----- to separate sections. Ordered from smallest to largest.
#
# Profiles are grouped by RAM tier, not by runtime — each alias resolves to
# whichever runtime(s) it supports (see models-aliases.conf). Where an alias
# only runs on one runtime, that's called out in the tier_description.
#
# To use: bin/setup --model <profile> downloads all aliases for that tier.
# To check: bin/doctor --profile <profile> shows what's missing.

# ─────────────────────────────────────────────────────────────────────────────
# Minimal: laptop, dev machines with constrained RAM

24gb	| 24GB	| 28GB	| Resource-constrained laptop/dev; gpt-oss-20b is Ollama-only	| qwen3.5-9b,gemma4-12b-mlx,gpt-oss-20b	| qwen3.5-9b

# ─────────────────────────────────────────────────────────────────────────────
# Standard: typical dev machine, small production

32gb	| 32GB	| 40GB	| Standard dev machine; qwen3.6-35b-mlx is Ollama-only	| qwen3.5-9b,qwen3.6-35b-a3b,qwen3-coder-30b,qwen3.6-35b-mlx,gemma4-26b-qat	| qwen3.6-35b-a3b
32gb-fast	| 32GB	| 40GB	| Fast for aider workflow	| qwen3-coder-30b	| qwen3-coder-30b
32gb-balance	| 32GB	| 40GB	| Accuracy + speed balance	| qwen3.6-35b-a3b,qwen3-coder-next	| qwen3.6-35b-a3b

# ─────────────────────────────────────────────────────────────────────────────
# Large: production servers, capable dev machines

64gb	| 64GB	| 96GB	| Production / large dev machine; qwen3.6-35b-mlx is Ollama-only	| qwen3.6-35b-a3b,qwen3-coder-30b,gemma4-26b-qat,qwen3.6-35b-mlx	| qwen3.6-35b-a3b
64gb-specialist	| 64GB	| 96GB	| Coding specialist (fastest aider)	| qwen3-coder-30b,qwen3-coder-next	| qwen3-coder-30b

# ─────────────────────────────────────────────────────────────────────────────
# Extra Large: well-resourced servers

128gb	| 128GB	| 999GB	| Well-resourced server	| qwen3.6-35b-a3b,qwen3-coder-30b,gemma4-26b-qat,devstral2-small	| qwen3.6-35b-a3b
